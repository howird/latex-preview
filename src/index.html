<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Preview</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; background: #525659; font: 13px system-ui, sans-serif; }
  #bar {
    position: fixed; inset: 0 0 auto 0; z-index: 2; height: 32px;
    display: flex; align-items: center; gap: 6px; padding: 0 10px;
    background: #323639; color: #eee;
  }
  #bar button { background: #4a4f53; color: #eee; border: 0; border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  #status { margin-left: auto; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pages { padding: 44px 0 24px; }
  .page { position: relative; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px #0006; }
  .page canvas { display: block; width: 100%; height: 100%; }
  .hl {
    position: absolute; pointer-events: none; border-radius: 2px;
    background: #ffd60055; outline: 2px solid #f5a300; transition: opacity 1s;
  }
  /* With a word to point at, its line is only context. */
  .hl.line { background: #ffd60033; outline: 0; }
  /* Ripple at a double-click: green once helix has the jump, red if it did not. */
  .ripple {
    position: absolute; pointer-events: none; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border-radius: 50%; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 30%, transparent);
    animation: ripple .6s ease-out forwards;
  }
  .ripple.ok { --c: #2ea043; }
  .ripple.err { --c: #e5534b; }
  @keyframes ripple { to { transform: scale(3); opacity: 0; } }
</style>
</head>
<body>
<div id="bar">
  <button id="out" title="Zoom out (-)">−</button>
  <button id="in" title="Zoom in (+)">+</button>
  <button id="fit" title="Fit width (0)">Fit</button>
  <span id="status">Double-click text to jump to it in your editor</span>
</div>
<div id="pages"></div>
<script type="module">
import * as pdfjs from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
pdfjs.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

const container = document.getElementById("pages");
const status = document.getElementById("status");
let doc = null;
let zoom = 1;
let scale = 1;       // CSS px per PDF point
let rendering = null;

const say = (msg) => { status.textContent = msg; };

function fitScale(page) {
  const w = page.getViewport({ scale: 1 }).width;
  return Math.min(window.innerWidth - 32, 1100) / w * zoom;
}

// Where the viewport is, as (page index, fraction into page), so it survives re-renders.
function anchor() {
  const y = window.scrollY + 44;
  for (const [i, el] of [...container.children].entries()) {
    if (el.offsetTop + el.offsetHeight > y) return [i, (y - el.offsetTop) / el.offsetHeight];
  }
  return [0, 0];
}

function restore([i, frac]) {
  const el = container.children[Math.min(i, container.children.length - 1)];
  if (el) window.scrollTo(0, el.offsetTop + frac * el.offsetHeight - 44);
}

// The page point under the cursor, so a pinch can keep it under the cursor after re-rendering.
function focusAt(x, y) {
  const pages = [...container.children];
  const i = Math.max(0, pages.findIndex((el) => el.getBoundingClientRect().bottom > y));
  const r = pages[i]?.getBoundingClientRect();
  return r && { i, x, y, fx: (x - r.left) / r.width, fy: (y - r.top) / r.height };
}

function restoreFocus({ i, x, y, fx, fy }) {
  const el = container.children[Math.min(i, container.children.length - 1)];
  if (!el) return;
  const r = el.getBoundingClientRect();
  window.scrollBy(r.left + fx * r.width - x, r.top + fy * r.height - y);
}

async function render(focus) {
  if (!doc) return;
  const job = (rendering = {});
  const where = anchor();
  const first = await doc.getPage(1);
  scale = fitScale(first);
  const dpr = window.devicePixelRatio || 1;
  const frag = document.createDocumentFragment();
  for (let n = 1; n <= doc.numPages; n++) {
    const page = n === 1 ? first : await doc.getPage(n);
    const vp = page.getViewport({ scale });
    const div = document.createElement("div");
    div.className = "page";
    div.dataset.page = n;
    div.style.width = `${vp.width}px`;
    div.style.height = `${vp.height}px`;
    const canvas = document.createElement("canvas");
    canvas.width = Math.floor(vp.width * dpr);
    canvas.height = Math.floor(vp.height * dpr);
    div.append(canvas);
    frag.append(div);
    await page.render({
      canvasContext: canvas.getContext("2d"),
      viewport: page.getViewport({ scale: scale * dpr }),
    }).promise;
    if (job !== rendering) return; // a newer render started
  }
  container.replaceChildren(frag);
  container.style.transform = "";
  if (focus) restoreFocus(focus);
  else restore(where);
}

async function load() {
  try {
    const next = await pdfjs.getDocument({ url: `/pdf?t=${Date.now()}` }).promise;
    const old = doc;
    doc = next;
    await render();
    old?.destroy();
    say(`Updated ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    say(`Could not load PDF: ${e.message}`);
  }
}

// Highlight a source line's boxes, and its word if there is one; scroll there unless the user is
// already looking (they just double-clicked it).
function highlight(boxes, words = [], scroll = true) {
  document.querySelectorAll(".hl").forEach((el) => el.remove());
  let firstEl = null;
  const draw = (b, cls) => {
    const pageEl = container.querySelector(`.page[data-page="${b.page}"]`);
    if (!pageEl) return;
    const hl = document.createElement("div");
    hl.className = cls;
    Object.assign(hl.style, {
      left: `${b.h * scale}px`, top: `${(b.v - b.H) * scale}px`,
      width: `${Math.max(b.W, 4) * scale}px`, height: `${Math.max(b.H, 4) * scale}px`,
    });
    pageEl.append(hl);
    firstEl ??= hl;
    setTimeout(() => { hl.style.opacity = 0; }, 1500);
    setTimeout(() => hl.remove(), 2600);
  };
  words.forEach((b) => draw(b, "hl"));
  boxes.forEach((b) => draw(b, words.length ? "hl line" : "hl"));
  if (scroll) firstEl?.scrollIntoView({ block: "center", behavior: "smooth" });
}

container.addEventListener("dblclick", async (e) => {
  const pageEl = e.target.closest(".page");
  if (!pageEl) return;
  window.getSelection()?.removeAllRanges();
  const r = pageEl.getBoundingClientRect();
  const body = {
    page: Number(pageEl.dataset.page),
    x: (e.clientX - r.left) / scale,
    y: (e.clientY - r.top) / scale,
  };
  let ok = false;
  try {
    const res = await fetch("/inverse", { method: "POST", body: JSON.stringify(body) });
    const { msg, boxes } = await res.json();
    ok = res.ok;
    say(ok ? `→ ${msg.split("/").slice(-2).join("/")}` : msg);
    highlight(boxes, [], false);
  } catch (err) {
    say(`Could not reach preview server: ${err.message}`);
  }
  const ripple = document.createElement("div");
  ripple.className = `ripple ${ok ? "ok" : "err"}`;
  Object.assign(ripple.style, { left: `${e.clientX - r.left}px`, top: `${e.clientY - r.top}px` });
  pageEl.append(ripple);
  ripple.addEventListener("animationend", () => ripple.remove());
});

const clampZoom = (z) => Math.min(4, Math.max(0.25, z));
const setZoom = (z, focus) => { zoom = clampZoom(z); render(focus); };

// Trackpad pinch (and ctrl+wheel) arrives as a wheel event with ctrlKey set. Left alone, the
// browser magnifies the already-drawn canvases, which pixelates them. Instead, preview the zoom
// with a CSS transform and re-render at the new scale once the gesture settles.
let pinch = null;

function pinchTo(x, y, factor) {
  if (!pinch) {
    const r = container.getBoundingClientRect();
    container.style.transformOrigin = `${x - r.left}px ${y - r.top}px`;
    pinch = { factor: 1, focus: focusAt(x, y) };
  }
  pinch.factor = clampZoom(zoom * factor) / zoom;
  container.style.transform = `scale(${pinch.factor})`;
}

function pinchEnd() {
  if (!pinch) return;
  const { factor, focus } = pinch;
  pinch = null;
  setZoom(zoom * factor, focus);
}

let pinchTimer;
window.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  pinchTo(e.clientX, e.clientY, (pinch?.factor ?? 1) * Math.exp(-e.deltaY / 100));
  clearTimeout(pinchTimer);
  pinchTimer = setTimeout(pinchEnd, 150);
}, { passive: false });

// Safari reports trackpad pinch as gesture events instead, with a scale relative to the start.
let gesture = null;
window.addEventListener("gesturestart", (e) => {
  e.preventDefault();
  gesture = { x: e.clientX, y: e.clientY };
});
window.addEventListener("gesturechange", (e) => {
  e.preventDefault();
  if (gesture) pinchTo(gesture.x, gesture.y, e.scale);
});
window.addEventListener("gestureend", (e) => {
  e.preventDefault();
  gesture = null;
  pinchEnd();
});
document.getElementById("in").onclick = () => setZoom(zoom * 1.2);
document.getElementById("out").onclick = () => setZoom(zoom / 1.2);
document.getElementById("fit").onclick = () => setZoom(1);
window.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "+" || e.key === "=") setZoom(zoom * 1.2);
  else if (e.key === "-") setZoom(zoom / 1.2);
  else if (e.key === "0") setZoom(1);
});
let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 200);
});

const events = new EventSource("/events");
events.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === "reload") load();
  else if (msg.type === "forward") highlight(msg.boxes, msg.words);
};
// The server restarted or the tunnel dropped: the PDF may have changed meanwhile.
events.onopen = () => { if (doc) load(); };
events.onerror = () => say("Disconnected from preview server, retrying…");

load();
</script>
</body>
</html>
